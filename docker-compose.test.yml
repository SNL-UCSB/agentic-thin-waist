services:
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/services/orchestration:/workspace
      DB_HOST: postgres
      TELEMETRY_SERVICE_URL: http://telemetry-service:8004
    networks:
      - agentic-network
    command: ["python", "-m", "pytest", "tests/integration", "-v", "--tb=short"]
