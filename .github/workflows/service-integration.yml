name: Service-Scoped Integration Tests (Matrix)

# Runs service-scoped integration tests from /tests using a matrix strategy.
#
# Each matrix entry brings up only the relevant service(s) and their required
# dependencies, then runs the corresponding tests from the root /tests folder.
# Tests are executed on the runner (accessing services via localhost) so that
# no per-service test container image is needed.
#
# Flow per matrix entry:
#   1. Bring up only the target service(s) and declared dependencies; wait for
#      every started healthcheck to pass.
#   2. Install Python test dependencies on the runner.
#   3. Run pytest against the service-scoped test path.
#   4. On failure: dump Compose logs and upload as an artifact.
#   5. Always: tear down with `down -v --remove-orphans`.

on:
  pull_request:
    branches: [main]

jobs:
  service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # CTP Service — no external dependencies
          - name: ctp-service
            compose_services: "ctp-service"
            test_path: "tests/integration/ctp"

          # Telemetry Service — depends on PostgreSQL and MinIO
          - name: telemetry-service
            compose_services: "postgres minio minio-init telemetry-service"
            test_path: "tests/integration/telemetry"

          # Substrate Worker — depends on Telemetry Service (and its deps)
          - name: substrate-worker
            compose_services: "postgres minio minio-init telemetry-service substrate-worker"
            test_path: "tests/integration/substrate_worker"

          # NetGent Service — depends on Substrate Worker + Telemetry Service
          - name: netgent-service
            compose_services: "postgres minio minio-init telemetry-service substrate-worker netgent-service"
            test_path: "tests/integration/netgent"

          # Experiment API — depends on CTP, Substrate Worker, Telemetry Service
          - name: experiment-api
            compose_services: "postgres minio minio-init telemetry-service ctp-service substrate-worker experiment-api"
            test_path: "tests/integration/experiment_api"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images for ${{ matrix.name }}
        run: |
          docker compose -f docker-compose.yml \
            build ${{ matrix.compose_services }}

      - name: Start services for ${{ matrix.name }} and wait for health checks
        run: |
          docker compose -f docker-compose.yml \
            up -d --wait ${{ matrix.compose_services }}
        # --wait polls each started service's healthcheck until healthy or timeout.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run tests for ${{ matrix.name }}
        run: |
          python -m pytest ${{ matrix.test_path }} \
            -v --tb=short
        # Services are accessible on localhost because Compose publishes ports
        # and the runner conftest.py defaults all service URLs to localhost:<port>.

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs --no-color \
            ${{ matrix.compose_services }} \
            > compose-logs-${{ matrix.name }}.txt 2>&1

      - name: Upload Compose logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.name }}
          path: compose-logs-${{ matrix.name }}.txt

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v --remove-orphans
