name: Orchestration-Telemetry Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/orchestration/**'
      - 'services/telemetry-service/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.github/workflows/orchestration-telemetry-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write test .env
        run: |
          cat > .env <<'EOF'
          DB_HOST=postgres
          DB_NAME=telemetry
          DB_PORT=5432
          DB_USER=admin
          DB_PASSWORD=admin123
          S3_ENDPOINT_URL=http://minio:9000
          S3_BUCKET_NAME=telemetry-artifacts
          NETGENT_S3_BUCKET_NAME=netgent
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin123
          S3_CONNECTION_RETRIES=3
          S3_CONNECTION_TIMEOUT_SECONDS=60
          EOF

      - name: Run orchestration-telemetry integration tests
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans
