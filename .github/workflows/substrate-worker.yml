name: Substrate Worker - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/substrate-worker/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/substrate-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy shared module into build context
        run: cp -r ../../shared ./shared

      - name: Build Docker image
        run: docker build -t substrate-worker .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/substrate-worker/tests:/app/tests \
            substrate-worker \
            python -m pytest tests/ -v --tb=short
