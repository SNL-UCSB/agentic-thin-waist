name: Substrate Worker - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/substrate-worker/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/substrate-worker/Dockerfile -t substrate-worker .

      - name: Start service via Docker Compose
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --wait substrate-worker

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/substrate-worker/tests:/app/tests \
            substrate-worker \
            python -m pytest tests/ -v --tb=short
