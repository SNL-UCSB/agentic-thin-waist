name: Integration & E2E Tests

# Spins up the full Docker Compose stack and runs every test under /tests.
#
# Flow:
#   1. Build all images.
#   2. Start the full stack; wait for every service health-check to pass.
#   3. On failure: dump all Compose logs and upload as an artifact.
#   4. Always: tear down with `down -v --remove-orphans`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose -f docker-compose.yml build

      - name: Start full stack and wait for health checks
        run: docker compose -f docker-compose.yml up -d --wait
        # --wait polls every service's declared healthcheck until all are healthy
        # or the command times out (inheriting the job timeout-minutes cap).

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs --no-color \
            > compose-logs.txt 2>&1

      - name: Upload Compose logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
