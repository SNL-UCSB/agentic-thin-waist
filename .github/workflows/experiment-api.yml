name: Experiment API - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/experiment-api/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/experiment-api/Dockerfile -t experiment-api .

      - name: Start service via Docker Compose
        run: |
          cp -r shared services/experiment-api/shared
          docker compose up -d --wait experiment-api

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/experiment-api/tests:/app/tests \
            experiment-api \
            python -m pytest tests/ -v --tb=short
