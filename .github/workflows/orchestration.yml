name: Orchestration - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "services/orchestration/**"
      - "shared/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repo .env from example
        run: cp .env.example .env

      - name: Build Docker image
        run: docker build -f services/orchestration/Dockerfile -t orchestration .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/orchestration/tests:/app/tests \
            orchestration \
            python -m pytest tests/ -v --tb=short

      - name: Start service via Docker Compose
        env:
          GOOGLE_API_KEY: dummy
        run: docker compose up -d --wait orchestration
