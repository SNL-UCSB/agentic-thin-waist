name: Netgent Service - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "services/netgent-service/**"
      - "shared/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repo .env from example
        run: cp .env.example .env

      - name: Build Docker image
        run: docker build -f services/netgent-service/Dockerfile -t netgent-service .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/netgent-service/tests:/app/tests \
            netgent-service \
            python -m pytest tests/ -v --tb=short

      - name: Start service via Docker Compose
        env:
          GOOGLE_API_KEY: dummy
        run: docker compose up -d --wait netgent-service
