name: Netgent Service - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/netgent-service/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/netgent-service/Dockerfile -t netgent-service .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/netgent-service/tests:/app/tests \
            netgent-service \
            python -m pytest tests/ -v --tb=short

      - name: Start service via Docker Compose
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --wait netgent-service
