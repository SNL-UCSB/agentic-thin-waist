name: Telemetry Service - Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/telemetry-service/**'
      - 'shared/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/telemetry-service/Dockerfile -t telemetry-service .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/services/telemetry-service/tests:/app/tests \
            telemetry-service \
            python -m pytest tests/ -v --tb=short
