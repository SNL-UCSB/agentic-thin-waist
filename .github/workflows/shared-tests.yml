name: Shared and Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'shared/**'
      - 'services/orchestration/**'
      - 'services/telemetry-service/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.env.example'
      - '.github/workflows/shared-tests.yml'

permissions:
  contents: read

jobs:
  orchestration-telemetry-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename .env.example to .env
        run: mv .env.example .env

      - name: Run orchestration-telemetry integration tests
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from orchestration-tests orchestration-tests

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans
