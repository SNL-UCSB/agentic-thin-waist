name: Shared Module Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared/**'

permissions:
  contents: read

jobs:
  test-shared:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo 'requirements.txt not found at repository root.'
            exit 1
          fi

      - name: Run shared tests
        run: |
          if [ -d shared/tests ] && find shared/tests -type f -name 'test_*.py' | grep -q .; then
            python -m pytest shared/tests/ -v --tb=short
          else
            echo 'No shared tests found under shared/tests/. Skipping.'
          fi
