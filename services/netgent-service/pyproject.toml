[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netgent-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.42.65",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "playwright>=1.58.0",
    "Pillow>=11.2.1",
    "psycopg[binary]>=3.2.6",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.30.6",
    "langgraph>=1.1.3",
    "langgraph-sdk>=0.3.12",
    "langchain-anthropic>=1.4.0,<2",
    "langchain-google-genai>=3.2.0,<4",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.20",
    "langchain>=1.2.13",
    "procrastinate>=3.7.2",
    "langgraph-cli[inmem]>=0.4.19",
    "browser-use==0.5.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
