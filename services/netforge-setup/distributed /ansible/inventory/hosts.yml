---
# =============================================================================
# netReplica Distributed Testbed — Ansible Inventory
# =============================================================================
#
# HOW TO FILL IN THIS FILE:
#   1. Replace every value under "CHANGE:" comments with your actual hardware.
#   2. Run `ansible all -m ping` to verify connectivity before deploying.
#   3. If your control node IS one of the servers listed below, uncomment
#      `ansible_connection: local` for that host so Ansible does not SSH to itself.
#
# TOPOLOGY:
#   [Internet] → [Upstream Server] ↔ [Switch] ↔ [LibreQoS Server]
#                                              ↔ [Downstream Server]
#                                                      ↕
#                                            GRE tunnels to Pinot/clients
# =============================================================================

all:
  children:

    upstream:
      hosts:
        upstream_server:
          # CHANGE: The IP address (or DNS hostname) Ansible uses to SSH to
          #         your upstream server (Edge Router / NAT gateway).
          #         Run `ip -br addr` on that machine to find the management IP.
          ansible_host: "UPSTREAM_MGMT_IP"

          # CHANGE: The Linux user Ansible will SSH in as.
          #         This user must have passwordless sudo, or you must pass
          #         --ask-become-pass when running playbooks.
          ansible_user: "ubuntu"

          # Uncomment if this server IS your Ansible control node:
          # ansible_connection: local

    downstream:
      hosts:
        downstream_server:
          # CHANGE: Management IP / hostname of your downstream server
          #         (Core Router / GRE aggregator).
          ansible_host: "DOWNSTREAM_MGMT_IP"
          ansible_user: "ubuntu"
          # ansible_connection: local

    libreqos:
      hosts:
        libreqos_server:
          # CHANGE: Management IP / hostname of your LibreQoS server
          #         (Traffic Shaper — must have LibreQoS pre-installed).
          ansible_host: "LIBREQOS_MGMT_IP"
          ansible_user: "ubuntu"
          # ansible_connection: local
