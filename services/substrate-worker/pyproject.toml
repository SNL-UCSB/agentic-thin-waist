[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate-worker"
version = "0.1.0"
description = "Privileged network execution worker for shaping, capture, and replay."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "httpx>=0.24.0",
    "playwright==1.58.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]==0.30.0",
]
# playwright is pinned to 1.58.0 to match the Node playwright-core@1.58.0 Chromium
# that the Dockerfile installs and ns1-wraps (via wrap-playwright-chrome.sh); the
# Python package must resolve that same wrapped browser so YouTube/Zoom/Twitch
# traffic traverses the shaped ns1 namespace. Do NOT add a separate
# `playwright install chromium` step — it would fetch an unwrapped browser and
# bypass traffic shaping. browser-use is intentionally omitted (nothing imports it).

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/substrate", "src/browser"]
