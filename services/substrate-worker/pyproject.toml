[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate-worker"
version = "0.1.0"
description = "Privileged network execution worker for shaping, capture, and replay."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "httpx>=0.24.0",
    "playwright==1.58.0",
    "browser-use==0.5.11",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]==0.30.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/substrate", "src/browser"]
