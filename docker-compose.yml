services:
  # Aux services
  postgres:
    image: postgres:15
    ports:
      - 5433:5432
    networks:
      - agentic-network
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ${POSTGRES_DATA_DIR:-/var/lib/postgresql/data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - agentic-network
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    networks:
      - agentic-network
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
        mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
        mc mb --ignore-existing local/$${NETGENT_S3_BUCKET_NAME:-netgent}
      "


  # D1: Experiment API - Orchestration Layer
  experiment-api:
    build:
      context: .
      dockerfile: ./services/experiment-api/Dockerfile
    container_name: experiment-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - CTP_SERVICE_URL=http://ctp-service:8001
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - NETGENT_SERVICE_URL=http://netgent-service:8003
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
    depends_on:
      - ctp-service
      - substrate-worker
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/experiment-api:/app
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # D1: CTP Service - Network Representation
  ctp-service:
    build:
      context: .
      dockerfile: ./services/ctp-service/Dockerfile
    container_name: ctp-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FLASK_ENV=development
      - CTP_DATABASE_URL=${CTP_DATABASE_URL}
      - CTP_PORT=${CTP_PORT:-8001}
      - CTP_LOG_LEVEL=${CTP_LOG_LEVEL:-INFO}
      - CTP_WORKERS=${CTP_WORKERS:-4}
      - CTP_WINDOW_DURATION_SEC=${CTP_WINDOW_DURATION_SEC:-30}
      - CTP_BURST_INTERVAL_MS=${CTP_BURST_INTERVAL_MS:-100}
      - CTP_GATEWAY_SUBNET=${CTP_GATEWAY_SUBNET:-169.231.0.0/16}
    networks:
      - agentic-network
    volumes:
      - ./services/ctp-service:/app
      - ${CTP_DIR}:${CTP_DIR}:ro
      - ${CTP_OUTPUT_DIR}:${CTP_OUTPUT_DIR}
      - ${CTP_TRANSFORMED_DIR:-/tmp/ctp-transformed}:${CTP_TRANSFORMED_DIR:-/tmp/ctp-transformed}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D1: Substrate Worker - Network Execution
  substrate-worker:
    build:
      context: .
      dockerfile: ./services/substrate-worker/Dockerfile
    container_name: substrate-worker
    ports:
      - "8002:8002"
      - "${BROWSERLESS_PORT:-3000}:3000"
    environment:
      - FLASK_ENV=development
      # local_docker selects substrate local profile at worker startup.
      - CONNECTIVITY_BACKEND=${CONNECTIVITY_BACKEND:-local_docker}
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - BROWSER_PROXY_HOST=172.16.1.1
      - BROWSER_PROXY_PORT=8888
      - CAPTURE_DIR=${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
      - CTP_DIR=${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-false}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      # Browserless session timeout (ms). Default is only 30s which kills long
      # browser workflows (e.g. sitting in a Zoom meeting) mid-run.
      - TIMEOUT=${BROWSERLESS_SESSION_TIMEOUT_MS:-600000}
      - BROWSERLESS_WS_ENDPOINT=ws://127.0.0.1:3000/chromium/playwright?timeout=${BROWSERLESS_SESSION_TIMEOUT_MS:-600000}
    depends_on:
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/substrate-worker:/app
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - substrate-runtime:/var/run/substrate
      - ${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}
      - ${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}:${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
      # Read-only mount of the host kernel's module directory so the worker
      # can `modprobe tcp_<algo>` the 14 loadable CCAnalyzer CCAs at startup.
      # No-op on Docker Desktop (LinuxKit kernel ships no loadable modules);
      # required on real Linux hosts (EC2, on-prem) for non-cubic/reno CCAs.
      - /lib/modules:/lib/modules:ro
    # Substrate worker requires privileged mode to use tc (traffic control)
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D2: NetGent Service - Application Execution
  netgent-service:
    build:
      context: .
      dockerfile: ./services/netgent-service/Dockerfile
    container_name: netgent-service
    ports:
      - "8003:8003"
    environment:
      - FLASK_ENV=development
      - NETGENT_RELOAD=true
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-true}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      - NETGENT_LLM_PROVIDER=${NETGENT_LLM_PROVIDER:-gemini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-}
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://substrate-worker:3000/chromium/playwright}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - NETGENT_S3_PUBLIC_URL=${NETGENT_S3_PUBLIC_URL:-http://localhost:9000}
      - NETGENT_S3_BUCKET_NAME=${NETGENT_S3_BUCKET_NAME:-netgent}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_CONNECTION_RETRIES=${S3_CONNECTION_RETRIES}
      - S3_CONNECTION_TIMEOUT_SECONDS=${S3_CONNECTION_TIMEOUT_SECONDS}
      - NETGENT_QUEUE_CONCURRENCY=${NETGENT_QUEUE_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      substrate-worker:
        condition: service_healthy
      telemetry-service:
        condition: service_started
    networks:
      - agentic-network
    volumes:
      - ./services/netgent-service:/app
      - ./shared:/shared
    pid: "service:substrate-worker"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Procrastinate worker: processes workflow jobs queued by netgent-service
  netgent-worker:
    build:
      context: .
      dockerfile: ./services/netgent-service/Dockerfile
    container_name: netgent-worker
    command: ["python", "-m", "api.worker.main"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-true}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      - NETGENT_LLM_PROVIDER=${NETGENT_LLM_PROVIDER:-gemini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-}
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://substrate-worker:3000/chromium/playwright}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - NETGENT_S3_PUBLIC_URL=${NETGENT_S3_PUBLIC_URL:-http://localhost:9000}
      - NETGENT_S3_BUCKET_NAME=${NETGENT_S3_BUCKET_NAME:-netgent}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_CONNECTION_RETRIES=${S3_CONNECTION_RETRIES}
      - S3_CONNECTION_TIMEOUT_SECONDS=${S3_CONNECTION_TIMEOUT_SECONDS}
      - NETGENT_QUEUE_CONCURRENCY=${NETGENT_QUEUE_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      netgent-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - agentic-network
    volumes:
      - ./services/netgent-service:/app
      - ./shared:/shared
    pid: "service:substrate-worker"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

  # D3: Telemetry Service - Telemetry and Results
  telemetry-service:
    build:
      context: .
      dockerfile: ./services/telemetry-service/Dockerfile
    container_name: telemetry-service
    ports:
      - "8004:8004"
    networks:
      - agentic-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      GUNICORN_TELEMETRY_WORKERS: ${GUNICORN_TELEMETRY_WORKERS:-8}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_CONNECTION_RETRIES: ${S3_CONNECTION_RETRIES}
      S3_CONNECTION_TIMEOUT_SECONDS: ${S3_CONNECTION_TIMEOUT_SECONDS}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://localhost:8004/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # D5: Orchestration Service - Claude + OpenClaw
  orchestration:
    build:
      context: .
      dockerfile: ./services/orchestration/Dockerfile
    container_name: orchestration
    ports:
      - "8005:8005"
    environment:
      - FLASK_ENV=development
      - EXPERIMENT_API_URL=http://experiment-api:8000
      - CTP_SERVICE_URL=${CTP_SERVICE_URL:-http://ctp-service:8001}
      - CTP_SERVICE_GLOBAL=${CTP_SERVICE_GLOBAL:-http://128.111.5.236:8001}
      - ORCH_CTP_INTENSITY_DIRECTION=${ORCH_CTP_INTENSITY_DIRECTION:-}
      - ORCH_CTP_SOURCE=${ORCH_CTP_SOURCE:-local_list}
      - ORCH_LOCAL_CTP_ROOT=${ORCH_LOCAL_CTP_ROOT:-}
      - ORCH_LOCAL_CTP_LIST=${ORCH_LOCAL_CTP_LIST:-}
      - ORCH_LOCAL_CTP_SELECTION=${ORCH_LOCAL_CTP_SELECTION:-first}
      - ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK=${ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK:-false}
      - ORCH_CTP_POINTER_MODE=${ORCH_CTP_POINTER_MODE:-local_path}
      - ORCH_WORKER_STARTUP_WAIT_SECONDS=${ORCH_WORKER_STARTUP_WAIT_SECONDS:-15}
      - ORCH_DEFAULT_WORKFLOW_SOURCE=${ORCH_DEFAULT_WORKFLOW_SOURCE:-auto}
      - ORCHESTRATOR_LLM_PROVIDER=${ORCHESTRATOR_LLM_PROVIDER:-anthropic}
      - NETGENT_LLM_PROVIDER=${NETGENT_LLM_PROVIDER:-gemini}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CONNECTIVITY_BACKEND=${CONNECTIVITY_BACKEND:-local_docker}
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - NETGENT_SERVICE_URL=http://netgent-service:8003
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://substrate-worker:3000/chromium/playwright}
      - SUBSTRATE_WORKER_IMAGE=${SUBSTRATE_WORKER_IMAGE:-agentic-thin-waist-substrate-worker}
      - SUBSTRATE_DOCKER_NETWORK=${SUBSTRATE_DOCKER_NETWORK:-agentic-thin-waist_agentic-network}
      - SUBSTRATE_WORKER_HOST=172.25.0.1
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - SUBSTRATE_CTP_DIR=${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}
      - SUBSTRATE_CAPTURE_DIR=${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-false}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      - PYTHONPATH=/app:/shared:/shared/clients/netgent/src:/app/app
    depends_on:
      - experiment-api
      - ctp-service
      - substrate-worker
      - netgent-service
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/orchestration:/app
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:ro
      - ${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}:${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Second orchestration instance for 10ms-latency sweeps — runs on host port 8006
  # so it can operate concurrently with the primary orchestration (port 8005) without
  # sharing the CTP-pin file.  Started only when the sweep10ms profile is requested:
  #   docker compose --profile sweep10ms up -d orchestration-10ms
  orchestration-10ms:
    build:
      context: .
      dockerfile: ./services/orchestration/Dockerfile
    container_name: orchestration-10ms
    profiles:
      - sweep10ms
    ports:
      - "8006:8005"
    environment:
      - FLASK_ENV=development
      - EXPERIMENT_API_URL=http://experiment-api:8000
      - CTP_SERVICE_URL=${CTP_SERVICE_URL:-http://ctp-service:8001}
      - CTP_SERVICE_GLOBAL=${CTP_SERVICE_GLOBAL:-http://128.111.5.236:8001}
      - ORCH_CTP_INTENSITY_DIRECTION=${ORCH_CTP_INTENSITY_DIRECTION:-}
      - ORCH_CTP_SOURCE=${ORCH_CTP_SOURCE:-local_list}
      - ORCH_LOCAL_CTP_ROOT=${ORCH_LOCAL_CTP_ROOT:-}
      - ORCH_LOCAL_CTP_LIST=${ORCH_LOCAL_CTP_LIST_10MS:-/mnt/md0/haarika/ctps_sweep_10ms.txt}
      - ORCH_LOCAL_CTP_SELECTION=${ORCH_LOCAL_CTP_SELECTION:-first}
      - ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK=${ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK:-false}
      - ORCH_CTP_POINTER_MODE=${ORCH_CTP_POINTER_MODE:-local_path}
      - ORCH_WORKER_STARTUP_WAIT_SECONDS=${ORCH_WORKER_STARTUP_WAIT_SECONDS:-15}
      - ORCH_DEFAULT_WORKFLOW_SOURCE=${ORCH_DEFAULT_WORKFLOW_SOURCE:-auto}
      - ORCHESTRATOR_LLM_PROVIDER=${ORCHESTRATOR_LLM_PROVIDER:-anthropic}
      - NETGENT_LLM_PROVIDER=${NETGENT_LLM_PROVIDER:-gemini}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CONNECTIVITY_BACKEND=${CONNECTIVITY_BACKEND:-local_docker}
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - NETGENT_SERVICE_URL=http://netgent-service:8003
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://substrate-worker:3000/chromium/playwright}
      - SUBSTRATE_WORKER_IMAGE=${SUBSTRATE_WORKER_IMAGE:-agentic-thin-waist-substrate-worker}
      - SUBSTRATE_DOCKER_NETWORK=${SUBSTRATE_DOCKER_NETWORK:-agentic-thin-waist_agentic-network}
      - SUBSTRATE_WORKER_HOST=172.25.0.1
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - SUBSTRATE_CTP_DIR=${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}
      - SUBSTRATE_CAPTURE_DIR=${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-false}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      - PYTHONPATH=/app:/shared:/shared/clients/netgent/src:/app/app
    depends_on:
      - experiment-api
      - ctp-service
      - substrate-worker
      - netgent-service
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/orchestration:/app
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:ro
      - ${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}:${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Third orchestration instance for 100Mbps/10ms-latency sweeps — runs on host port 8007.
  orchestration-100mbps-10ms:
    build:
      context: .
      dockerfile: ./services/orchestration/Dockerfile
    container_name: orchestration-100mbps-10ms
    profiles:
      - sweep100mbps10ms
    ports:
      - "8007:8005"
    environment:
      - FLASK_ENV=development
      - EXPERIMENT_API_URL=http://experiment-api:8000
      - CTP_SERVICE_URL=${CTP_SERVICE_URL:-http://ctp-service:8001}
      - CTP_SERVICE_GLOBAL=${CTP_SERVICE_GLOBAL:-http://128.111.5.236:8001}
      - ORCH_CTP_INTENSITY_DIRECTION=${ORCH_CTP_INTENSITY_DIRECTION:-}
      - ORCH_CTP_SOURCE=${ORCH_CTP_SOURCE:-local_list}
      - ORCH_LOCAL_CTP_ROOT=${ORCH_LOCAL_CTP_ROOT:-}
      - ORCH_LOCAL_CTP_LIST=${ORCH_LOCAL_CTP_LIST_100MBPS_10MS:-/mnt/md0/haarika/ctps_sweep_100mbps_10ms.txt}
      - ORCH_LOCAL_CTP_SELECTION=${ORCH_LOCAL_CTP_SELECTION:-first}
      - ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK=${ORCH_LOCAL_CTP_ALLOW_RANGE_FALLBACK:-false}
      - ORCH_CTP_POINTER_MODE=${ORCH_CTP_POINTER_MODE:-local_path}
      - ORCH_WORKER_STARTUP_WAIT_SECONDS=${ORCH_WORKER_STARTUP_WAIT_SECONDS:-15}
      - ORCH_DEFAULT_WORKFLOW_SOURCE=${ORCH_DEFAULT_WORKFLOW_SOURCE:-auto}
      - ORCHESTRATOR_LLM_PROVIDER=${ORCHESTRATOR_LLM_PROVIDER:-anthropic}
      - NETGENT_LLM_PROVIDER=${NETGENT_LLM_PROVIDER:-gemini}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - CONNECTIVITY_BACKEND=${CONNECTIVITY_BACKEND:-local_docker}
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - NETGENT_SERVICE_URL=http://netgent-service:8003
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://substrate-worker:3000/chromium/playwright}
      - SUBSTRATE_WORKER_IMAGE=${SUBSTRATE_WORKER_IMAGE:-agentic-thin-waist-substrate-worker}
      - SUBSTRATE_DOCKER_NETWORK=${SUBSTRATE_DOCKER_NETWORK:-agentic-thin-waist_agentic-network}
      - SUBSTRATE_WORKER_HOST=172.25.0.1
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - SUBSTRATE_CTP_DIR=${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}
      - SUBSTRATE_CAPTURE_DIR=${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
      - NETGENT_USE_LOCAL=${NETGENT_USE_LOCAL:-false}
      - NETGENT_NAMESPACE=${NETGENT_NAMESPACE:-ns1}
      - PYTHONPATH=/app:/shared:/shared/clients/netgent/src:/app/app
    depends_on:
      - experiment-api
      - ctp-service
      - substrate-worker
      - netgent-service
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/orchestration:/app
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:${SUBSTRATE_CTP_DIR:-/tmp/substrate-ctp}:ro
      - ${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}:${SUBSTRATE_CAPTURE_DIR:-/tmp/substrate-capture}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
