services:
  python-base:
    profiles:
      - build
    image: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    build:
      context: .
      dockerfile: ./Dockerfile.base

  # Aux services
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    networks:
      - agentic-network
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - agentic-network
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    networks:
      - agentic-network
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
        mc mb --ignore-existing local/$${S3_BUCKET_NAME} &&
        mc mb --ignore-existing local/$${NETGENT_S3_BUCKET_NAME:-netgent}
      "

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: unless-stopped
    ports:
      - "${BROWSERLESS_PORT:-3000}:3000"
    environment:
      CONCURRENT: ${MAX_CONCURRENT_SESSIONS:-5}
      QUEUED: ${QUEUE_LENGTH:-10}
      PROXY: ${BROWSERLESS_PROXY:-}
    networks:
      - agentic-network
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/json/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # D1: Experiment API - Orchestration Layer
  experiment-api:
    image: agentic-thin-waist-experiment-api:latest
    build:
      context: .
      dockerfile: ./services/experiment-api/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    container_name: experiment-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - CTP_SERVICE_URL=http://ctp-service:8001
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - NETGENT_SERVICE_URL=http://netgent-service:8003
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
    depends_on:
      - ctp-service
      - substrate-worker
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/experiment-api:/app
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # D1: CTP Service - Network Representation
  ctp-service:
    image: agentic-thin-waist-ctp-service:latest
    build:
      context: .
      dockerfile: ./services/ctp-service/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    container_name: ctp-service
    ports:
      - "8001:8001"
    environment:
      - FLASK_ENV=development
    networks:
      - agentic-network
    volumes:
      - ./services/ctp-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D1: Substrate Worker - Network Execution
  substrate-worker:
    image: agentic-thin-waist-substrate-worker:latest
    build:
      context: .
      dockerfile: ./services/substrate-worker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    container_name: substrate-worker
    ports:
      - "8002:8002"
    environment:
      - FLASK_ENV=development
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - BROWSER_PROXY_HOST=172.16.1.1
      - BROWSER_PROXY_PORT=8888
    depends_on:
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/substrate-worker:/app
      - /var/run/docker.sock:/var/run/docker.sock
    # Substrate worker requires privileged mode to use tc (traffic control)
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D2: NetGent Service - Application Execution
  netgent-service:
    build:
      context: .
      dockerfile: ./services/netgent-service/Dockerfile
    container_name: netgent-service
    ports:
      - "8003:8003"
    environment:
      - FLASK_ENV=development
      - NETGENT_RELOAD=true
      - SUBSTRATE_WORKER_URL=http://substrate-worker:8002
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8004
      - BROWSERLESS_WS_ENDPOINT=${BROWSERLESS_WS_ENDPOINT:-ws://browserless:3000/chromium/playwright}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - NETGENT_S3_BUCKET_NAME=${NETGENT_S3_BUCKET_NAME:-netgent}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_CONNECTION_RETRIES=${S3_CONNECTION_RETRIES}
      - S3_CONNECTION_TIMEOUT_SECONDS=${S3_CONNECTION_TIMEOUT_SECONDS}
      - NETGENT_QUEUE_CONCURRENCY=${NETGENT_QUEUE_CONCURRENCY:-1}
    depends_on:
      browserless:
        condition: service_healthy
      postgres:
        condition: service_healthy
      substrate-worker:
        condition: service_started
      telemetry-service:
        condition: service_started
    networks:
      - agentic-network
    volumes:
      - ./services/netgent-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Procrastinate worker: processes workflow jobs queued by netgent-service
  netgent-worker:
    build:
      context: .
      dockerfile: ./services/netgent-service/Dockerfile
    container_name: netgent-worker
    command: ["python", "-m", "api.worker.main"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NETGENT_QUEUE_CONCURRENCY=${NETGENT_QUEUE_CONCURRENCY:-1}
    depends_on:
      netgent-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - agentic-network
    volumes:
      - ./services/netgent-service:/app

  # D3: Telemetry Service - Telemetry and Results
  telemetry-service:
    image: agentic-thin-waist-telemetry-service:latest
    build:
      context: .
      dockerfile: ./services/telemetry-service/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    container_name: telemetry-service
    ports:
      - "8004:8004"
    networks:
      - agentic-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_CONNECTION_RETRIES: ${S3_CONNECTION_RETRIES}
      S3_CONNECTION_TIMEOUT_SECONDS: ${S3_CONNECTION_TIMEOUT_SECONDS}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://localhost:8004/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # D5: Orchestration Service - Claude + OpenClaw
  orchestration:
    image: agentic-thin-waist-orchestration:latest
    build:
      context: .
      dockerfile: ./services/orchestration/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-agentic-thin-waist-python-base:latest}
    container_name: orchestration
    ports:
      - "8005:8005"
    environment:
      - FLASK_ENV=development
      - EXPERIMENT_API_URL=http://experiment-api:8000
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    depends_on:
      - experiment-api
      - ctp-service
      - substrate-worker
      - netgent-service
      - telemetry-service
    networks:
      - agentic-network
    volumes:
      - ./services/orchestration:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  agentic-network:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
