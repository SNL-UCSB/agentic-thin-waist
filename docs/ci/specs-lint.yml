name: specs-lint
on:
  pull_request:
    paths: ['specs/**', '.specify/**']
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure, references, constitution version
        run: |
          set -euo pipefail
          fail=0
          # (a) every feature dir has the three artifacts
          for d in specs/[0-9]*-*/; do
            for f in spec.md plan.md tasks.md; do
              [ -f "$d$f" ] || { echo "MISSING: $d$f"; fail=1; }
            done
          done
          # (b) doc references resolve
          grep -rhoE 'docs/PRAMANA_[A-Za-z_]+\.md' specs/ | sort -u | while read -r ref; do
            [ -f "$ref" ] || { echo "DANGLING REF: $ref"; exit 1; }
          done
          # (c) plans gated against the current constitution version
          ver=$(grep -oE 'Version..: [0-9]+\.[0-9]+\.[0-9]+' .specify/memory/constitution.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          for p in specs/[0-9]*-*/plan.md; do
            grep -q "Constitution: v$ver" "$p" || { echo "STALE CONSTITUTION ($ver expected): $p"; fail=1; }
          done
          # (d) evidence-path freeze (Art. III)
          if [ -f .specify/memory/evidence-path.txt ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
            while read -r frozen; do
              case "$frozen" in \#*|"") continue;; esac
              if echo "$changed" | grep -qF "$frozen"; then
                echo "${{ contains(github.event.pull_request.labels.*.name, 'bugfix-evidence-path') }}" | grep -q true \
                  || { echo "FROZEN PATH TOUCHED without label: $frozen"; fail=1; }
              fi
            done < .specify/memory/evidence-path.txt
          fi
          exit $fail
